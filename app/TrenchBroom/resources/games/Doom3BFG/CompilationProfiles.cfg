{
	"profiles": [
		{
			"name": "dmap (rbdmap)",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${GAME_DIR_PATH}/${MODS[-1]}/maps/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nogui +set fs_basepath \"${GAME_DIR_PATH}\" +set fs_game ${MODS[-1]} ${MAP_BASE_NAME}",
					"tool": "${rbdmap}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		},
		{
			"name": "dmap (in engine)",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${GAME_DIR_PATH}/${MODS[-1]}/maps/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "+set fs_basepath \"${GAME_DIR_PATH}\" +set fs_game ${MODS[-1]} +dmap ${MAP_BASE_NAME} +quit",
					"tool": "${rbdoom3bfg}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		},
		{
			"name": "dmap (rbdmap) and run",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${GAME_DIR_PATH}/${MODS[-1]}/maps/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nogui +set fs_basepath \"${GAME_DIR_PATH}\" +set fs_game ${MODS[-1]} ${MAP_BASE_NAME}",
					"tool": "${rbdmap}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"engineProfileId": "doom3bfg-rbdoom3bfg",
					"treatLaunchFailureAsError": true,
					"type": "launchEngine"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		},
		{
			"name": "test: dmap noAAS and run",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"stripEntityPattern": "info_player_start",
					"entityToAdd": [
						{
							"key": "classname",
							"value": "info_player_start"
						}
					],
					"target": "${GAME_DIR_PATH}/${MODS[-1]}/maps/_test/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nogui +set fs_basepath \"${GAME_DIR_PATH}\" +set fs_game ${MODS[-1]} noAAS _test/${MAP_BASE_NAME}",
					"tool": "${rbdmap}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"engineProfileId": "doom3bfg-rbdoom3bfg-test",
					"treatLaunchFailureAsError": true,
					"type": "launchEngine"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		},
		{
			"name": "test: dmap and run",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"stripEntityPattern": "info_player_start",
					"entityToAdd": [
						{
							"key": "classname",
							"value": "info_player_start"
						}
					],
					"target": "${GAME_DIR_PATH}/${MODS[-1]}/maps/_test/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nogui +set fs_basepath \"${GAME_DIR_PATH}\" +set fs_game ${MODS[-1]} _test/${MAP_BASE_NAME}",
					"tool": "${rbdmap}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"engineProfileId": "doom3bfg-rbdoom3bfg-test",
					"treatLaunchFailureAsError": true,
					"type": "launchEngine"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		}
	],
	"version": 1
}
