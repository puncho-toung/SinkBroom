{
	"profiles": [
		{
			"name": "dmap (rbdmap)",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${GAME_DIR_PATH}/${MODS[0]}/maps/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nogui +set fs_basepath \"${GAME_DIR_PATH}\" ${MAP_BASE_NAME}",
					"tool": "${rbdmap}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		},
		{
			"name": "dmap (in engine)",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${GAME_DIR_PATH}/${MODS[0]}/maps/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "+set fs_basepath \"${GAME_DIR_PATH}\" +dmap ${MAP_BASE_NAME} +quit",
					"tool": "${rbdoom3bfg}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		},
		{
			"name": "dmap (rbdmap) and run",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${GAME_DIR_PATH}/${MODS[0]}/maps/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nogui +set fs_basepath \"${GAME_DIR_PATH}\" ${MAP_BASE_NAME}",
					"tool": "${rbdmap}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"engineProfileId": "doom3bfg-rbdoom3bfg",
					"treatLaunchFailureAsError": true,
					"type": "launchEngine"
				}
			],
			"workdir": "${GAME_DIR_PATH}"
		}
	],
	"version": 1
}
