{
    "version": 9,
    "name": "Doom 3 BFG", // must match the "// Game: Doom 3 BFG" header RBDOOM-3-BFG writes into every map
    "icon": "Icon.png",
    "experimental": false,
    "fileformats": [
        { "format": "Doom3 (Valve)" } // matches the "// Format: Doom3 (Valve)" header RBDOOM-3-BFG writes
    ],
    "filesystem": {
        "searchpath": "base",
        "packageformat": { "extension": ".pk4", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [ ".tga", ".png", ".jpg", ".jpeg", ".dds" ],
        "shaderSearchPath": "materials",
        "shaderExtensions": [ ".mtr" ],
        "shaderImageSearchPaths": [ "_tb" ], // where the engine's exportImagesToTrenchBroom writes its images
        // list only the .mtr materials, as the RBDOOM-3-BFG TrenchBroom fork did: the engine makes an
        // undeclared name an implicit translucent material that does not seal the map, so a face that
        // shows a loose image leaks
        "implicitMaterialsFromImages": false,
        // the materials of the Face inspector's Utility tab, with the descriptions shown under them;
        // the first matching pattern wins, so the catch-alls come last
        "utilityMaterials": [
            { "pattern": "common/caulk", "description": "Invisible and solid; seals the map. Use it on faces the player never sees." },
            { "pattern": "common/nodraw", "description": "Invisible and non-solid, no shadow: a face that exists but is never seen or touched." },
            { "pattern": "common/nodrawsolid", "description": "Invisible but solid, no shadow: blocks movement where nothing is drawn." },
            { "pattern": "common/clip", "description": "Invisible wall for players and monsters; moveables and projectiles pass through." },
            { "pattern": "common/clip_plusmovables", "description": "Clip for players, monsters and moveables; projectiles pass through." },
            { "pattern": "common/full_clip", "description": "Solid to players, monsters and moveables, and it stops projectiles too." },
            { "pattern": "common/player_clip", "description": "Invisible wall for players only." },
            { "pattern": "common/monster_clip", "description": "Invisible wall for monsters only; keeps the AI out of places it should not path into." },
            { "pattern": "common/moveable_clip", "description": "Invisible wall for moveables (physics objects) only." },
            { "pattern": "common/ik_clip", "description": "Foot placement only: inverse kinematics treats it as solid; nothing else collides with it." },
            { "pattern": "common/moveableclipmodel", "description": "Shows the clip image; by its name meant for moveable models' collision meshes; on a world brush it is an invisible solid face without shadow." },
            { "pattern": "common/cushion", "description": "Player clip that removes fall damage: an invisible landing pad." },
            { "pattern": "common/ladder", "description": "Ladder: players climb it; solid to players and monsters, not to projectiles; invisible." },
            { "pattern": "common/slick", "description": "Frictionless floor: the player slides." },
            { "pattern": "common/noimpact", "description": "Projectiles vanish into it instead of exploding: a thin sliver over surfaces that should not react." },
            { "pattern": "common/collision", "description": "Collision-only surface for models: it blocks but is never drawn." },
            { "pattern": "common/shadow", "description": "Invisible and non-solid, but casts shadows: a shadow caster for open geometry." },
            { "pattern": "common/shadow2", "description": "Like shadow, without self-shadowing." },
            { "pattern": "common/mirror", "description": "Mirror: the engine renders the scene's reflection on this face." },
            { "pattern": "common/origin", "description": "Origin brush: its centre becomes the entity's origin, the pivot for rotation." },
            { "pattern": "common/black", "description": "Visible black that casts shadows: a blocker for the light grid (like sfx/black with shadows); non-solid." },
            { "pattern": "common/trigger", "description": "Trigger volume: invisible and non-solid; the generic texture for trigger brushes." },
            { "pattern": "common/trigmulti", "description": "Trigger volume for trigger_multiple, trigger_facing and trigger_touch; also the editor texture of the fixed-size trigger_presize." },
            { "pattern": "common/trigonce", "description": "Trigger volume for trigger_once." },
            { "pattern": "common/trigtimer", "description": "Editor texture of trigger_timer, a point entity that fires its targets repeatedly; it has no volume." },
            { "pattern": "common/trigrelay", "description": "Editor texture of trigger_relay, a point entity that passes a trigger on to its targets; it has no volume." },
            { "pattern": "common/trighurt", "description": "Trigger volume for trigger_hurt: damages what enters." },
            { "pattern": "common/trigfade", "description": "Editor texture of trigger_fade, a point entity that fades the screen when triggered; it has no volume." },
            { "pattern": "common/triggui", "description": "Editor texture of trigger_guiOverlay, a point entity that toggles a full-screen GUI overlay; it has no volume." },
            { "pattern": "common/trigair", "description": "Trigger volume from the original game; no shipped trigger entity uses it." },
            { "pattern": "common/trigentityname", "description": "Trigger volume for trigger_entityname: fires when the named entity enters." },
            { "pattern": "common/trigentityname_once", "description": "Trigger volume for trigger_once_entityname." },
            { "pattern": "common/trigflashlight", "description": "Trigger volume for trigger_flashlight: fires when the flashlight beam hits it." },
            { "pattern": "common/nodrop", "description": "No-drop volume: items are not dropped inside it (keeps death pits clean); invisible and non-solid." },
            { "pattern": "common/speaker", "description": "Editor texture of the speaker, func_earthquake and multiplayer sound_* point entities; not carved by CSG." },
            { "pattern": "common/particle", "description": "Editor helper texture: not carved by CSG, casts no shadow; no shipped entity definition uses it." },
            { "pattern": "common/occlusion", "description": "Occlusion surface for models: a model surface with it is used for occlusion culling instead of the visual surfaces; never drawn." },
            { "pattern": "common/entityGui", "description": "GUI surface 1: shows the entity's gui key on this face; player clip." },
            { "pattern": "common/entityGui2", "description": "GUI surface 2: shows the entity's gui2 key; player clip." },
            { "pattern": "common/entityGui3", "description": "GUI surface 3: shows the entity's gui3 key; player clip." },
            { "pattern": "common/pda_gui", "description": "GUI surface that shows the level map GUI." },
            { "pattern": "common/overdrawtest", "description": "Debug: translucent overdraw visualisation." },
            { "pattern": "editor/visportal", "description": "Area portal: separates two areas; dmap stops its area flood fill here and the AAS takes its cluster portals from it. The brush must fill the opening." },
            { "pattern": "editor/aassolid", "description": "AAS solid: the AI compiler treats the brush as solid; nothing in game." },
            { "pattern": "editor/aasobstacle", "description": "AAS obstacle: for func_aas_obstacle brushes, an obstacle the AI routing can toggle." },
            { "pattern": "editor/aasportal", "description": "func_aas_portal bounds: overlaps a visportal so the AI routing can toggle it; not an area portal itself." },
            { "pattern": "common/*", "description": "Utility texture from textures/common; the tooltip lists its surface parameters." },
            { "pattern": "editor/*", "description": "Editor helper texture from textures/editor." }
        ]
    },
    "entities": {
        "definitions": [
            "DOOM-3-slim.fgd",
            "DOOM-3-all.fgd",
            "DOOM-3-slim-and-models.fgd",
            "DOOM-3-all-and-models.fgd",
            "DOOM-3-models.fgd",
            "DOOM-3-multiplayer.fgd"
        ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "setDefaultProperties": false, // the FGDs carry entityDef spawnargs as defaults; never copy them into maps
        "modelConvention": "idtech4", // implemented by package 04
        "naming": { "uniqueNames": true, "nameKey": "name", "brushEntityModelKey": "model" }, // unique names; brush entities get model = name, which dmap requires
        "rotation": { "policy": "idtech4" }, // read rotation, angles, angle as the engine does; write angles
        "lightEditor": "idtech4" // the light editor panel edits lights with the engine's render light keys
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger_*",
                "material": "common/trigmulti"
            },
            // the engine's AAS compiler takes cluster portals only from worldspawn editor/visportal brushes; the entity's brush is its toggle bounds and must not be an area portal, or dmap drops it and the engine draws a default cube in its place
            {
                "name": "AASPortal",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "func_aas_portal",
                "material": "editor/aasportal"
            },
            {
                "name": "AASObstacle",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "func_aas_obstacle",
                "material": "editor/aasobstacle"
            }
        ],
        "brushface": [
            {
                "name": "Caulk",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/caulk"
            },
            {
                "name": "Nodraw",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/nodraw*"
            },
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/*clip*"
            },
            {
                "name": "Collision",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/collision"
            },
            {
                "name": "Shadow",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/shadow*"
            },
            {
                "name": "Origin",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "common/origin"
            },
            {
                "name": "Visportal",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "editor/visportal"
            },
            {
                "name": "AAS",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "editor/aas*"
            },
            {
                "name": "Decal",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "decals/*"
            },
            // the tags below match the lowercase surface parameters the .mtr parser derives
            {
                "name": "ClipSurface",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "playerclip", "monsterclip", "moveableclip", "ikclip" ]
            },
            {
                "name": "TriggerSurface",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "trigger", "flashlight_trigger" ]
            },
            {
                "name": "Areaportal",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "areaportal" ]
            },
            {
                "name": "Invisible",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "nostages" ] // the material has no drawn stages
            },
            {
                "name": "Liquid",
                "match": "surfaceparm",
                "pattern": [ "water" ]
            },
            {
                "name": "Translucent",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "coverage_translucent" ]
            },
            {
                "name": "AASSurface",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "aassolid", "aasobstacle" ]
            },
            {
                "name": "CollisionSurface",
                "attribs": [ "transparent" ],
                "match": "surfaceparm",
                "pattern": [ "collision" ]
            },
            {
                "name": "Broken",
                "match": "surfaceparm",
                "pattern": [ "engine_defaulted" ] // the engine would draw its default material here
            }
        ]
    },
    "faceattribs": {
        "defaults": {
            "scale": [0.5, 0.5]
        },
        "surfaceflags": [],
        "contentflags": []
    },
    "softMapBounds":"-131072 -131072 -131072 131072 131072 131072",
    "compilationTools": [
        { "name": "rbdmap", "description": "Path to the standalone rbdmap executable (built from rbdoom/neo/tools/compilers). Compiles .proc, .cm and .aas." },
        { "name": "rbdoom3bfg", "description": "Path to the RBDoom3BFG executable, used for the in-engine dmap profile." }
    ]
}
